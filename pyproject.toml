[project]
name = "loadline"
version = "0.1.0"
description = "Loadline — capacity agent for neatHack"
readme = "hackathon.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "neatlogs[pydantic-ai]==1.4.26",
  "pydantic-ai==2.54.0",
  "pydantic==2.14.0",
  "pydantic-settings==2.15.0",
  "python-dotenv==1.2.4",
  "pyyaml==6.0.2",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[project.scripts]
loadline = "loadline.cli:main"
loadline-neatlogs-probe = "loadline.neatlogs_probe:main"
send-first-trace = "loadline.send_first_trace:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: downloads the pinned official Entire archives or needs Docker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loadline"]

[tool.hatch.build.targets.wheel.force-include]
"skills/loadline-run/SKILL.md" = "loadline/skills/bundled/loadline-run/SKILL.md"

